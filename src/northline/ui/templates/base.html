<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Northline{% endblock %} · Northline</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead frame">
    <div class="mast-top">
      <p class="vol">Vol. 01 — Payables</p>
      <a class="wordmark" href="/">Northline</a>
      <p class="issue">Fund // Controls first</p>
    </div>
    <nav class="nav" aria-label="Primary">
      <a href="/" {% if page == "desk" %}aria-current="page"{% endif %}>Desk</a>
      <a href="/invoices" {% if page == "invoices" %}aria-current="page"{% endif %}>Invoices</a>
      <a href="/review" {% if page == "review" %}aria-current="page"{% endif %}>Queue{% if pending %}<em>{{ "%02d"|format(pending) }}</em>{% endif %}</a>
      <a href="/audit" {% if page == "audit" %}aria-current="page"{% endif %}>Audit</a>
      <a href="/invoices">Run</a>
    </nav>
  </header>
  <main id="main" class="frame">
    {% block body %}{% endblock %}
  </main>
  <footer class="colophon">
    <span>Controls are code. Grok writes the note.</span>
    <span>Set after Parallel — Finance</span>
  </footer>
  {% block script %}{% endblock %}
</body>
</html>
