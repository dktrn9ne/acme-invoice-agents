[project]
name = "northline"
version = "1.0.0"
description = "Acme Corp payables control desk. LangGraph orchestration, Grok for judgment, deterministic controls for money."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Maurice Thomas"}]
dependencies = [
    "langgraph==1.2.22",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langchain-core==1.8.3",
    "langchain-xai==1.4.1",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "pypdf==7.1.1",
    "rich==15.0.0",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
northline = "northline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
